[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelfork"
version = "0.1.0"
description = "Lean-kernel-located in-place forks for RL credit in diffusion-LM theorem provers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sebastian Roda" }]
dependencies = [
  "numpy>=1.24",
  "torch>=2.2",
  "transformers>=4.40",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kernelfork*", "baselines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "lean: requires Lean 4 REPL (skipped in CI when unavailable)",
  "mock: uses MockLeanClient and tests/mock_data fixtures",
  "real: invokes real Lean 4 via CliLeanClient (no MOCK)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
