name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: make lint
      - name: Pytest (CPU, MOCK)
        run: pytest -q -m "not lean"
      - name: Smoke (MOCK)
        run: make smoke PYTHON=python
